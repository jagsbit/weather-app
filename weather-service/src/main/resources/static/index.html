<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1>City weather</h1>
    <input id="q" type="search" autocomplete="off" placeholder="Search city" aria-label="Search city">
    <p id="status" role="status" aria-live="polite"></p>
    <div id="unit-toggle" role="group" aria-label="Temperature unit">
      <button type="button" data-unit="C" aria-pressed="true" class="active">&deg;C</button>
      <button type="button" data-unit="F" aria-pressed="false">&deg;F</button>
    </div>
    <ul id="results"></ul>
    <section id="forecast" hidden></section>
  </main>
</body>
</html>
